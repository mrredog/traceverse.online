# Netlify deployment for TraceVerse (TanStack Start + Nitro).
# The Lovable Vite config builds for Cloudflare by default; NITRO_PRESET switches it to Netlify.
[build]
  command = "bun install && bun run build"
  publish = "dist/client"

[build.environment]
  NITRO_PRESET = "netlify"
  NODE_VERSION = "22"
  BUN_VERSION = "1.2.0"

[dev]
  command = "bun run dev"
  port = 5173
  targetPort = 5173

# The service worker must never be cached, or updates would not reach installed apps.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"
