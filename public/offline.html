<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TraceVerse is offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #120c1c; color: #f4eefc; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
  h1 { font-size: 22px; margin: 16px 0 8px; }
  p { margin: 0 0 20px; color: #b3a6c9; font-size: 14px; max-width: 28ch; }
  button { background: #8b5cf6; color: #fff; border: 0; border-radius: 14px; padding: 12px 20px; font-size: 14px; font-weight: 600; }
  img { width: 72px; height: 72px; border-radius: 18px; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>TraceVerse needs a connection to load stories. Check your network and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
